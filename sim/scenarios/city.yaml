name: city
# The 2x2 signalised grid inside a small city: arterial ring with bus lanes, residential short-cuts
# (no trucks or buses), gates at the corners. Mixed vehicles. Built by sim/sumo/generate_city_net.py.
network: grid2x2_city
simulation:
  duration: 1200
  step_length: 1.0

traffic:
  seed: 1
  # Share of each vehicle category (sim/vehicles.py). Eco cars and ambulances always have a radio.
  vehicle_mix: {car: 0.55, eco_car: 0.15, motorcycle: 0.10, bus: 0.05, truck: 0.15}
  od_flows:
    # Through the signalised grid (the lights carry this traffic)
    - {from: SW, to: NE, rate: 160, via: [J0J1, J1J3]}
    - {from: NE, to: SW, rate: 160, via: [J3J2, J2J0]}
    - {from: SE, to: NW, rate: 140, via: [J1J0, J0J2]}
    - {from: NW, to: SE, rate: 140, via: [J2J3, J3J1]}
    # Free choice: SUMO routes each vehicle for its class (ring, grid or short-cut)
    - {from: SW, to: SE, rate: 60}
    - {from: SE, to: NE, rate: 60}
    - {from: NE, to: NW, rate: 60}
    - {from: NW, to: SW, rate: 60}
    - {from: SW, to: NW, rate: 50}
    - {from: NW, to: NE, rate: 50}
    - {from: NE, to: SE, rate: 50}
    - {from: SE, to: SW, rate: 50}

emergency:
  enabled: false
  vehicles: []

incident:
  enabled: false
