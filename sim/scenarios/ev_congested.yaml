name: ev_congested
network: grid2x2
simulation:
  duration: 1000
  step_length: 1.0

# Ambulance routing test: heavy demand. The two heavy diagonal flows use J0J1 -> J1J3 by default,
# so the ambulance's default corridor queues up while the parallel route J0J2 -> J2J3 has spare capacity.
# Same demand as the navigation scenario; no navigation for the other vehicles.
traffic:
  seed: 1
  rate_per_od: 150
  od_flows:
    - {from: "bottom0J0", to: "top1J3", rate: 250}
    - {from: "left0J0", to: "right1J3", rate: 250}
    - {from: "bottom1J1", to: "top0J2", rate: 150}
    - {from: "left1J2", to: "right0J1", rate: 150}
    - {from: "top0J2", to: "bottom1J1", rate: 150}
    - {from: "top1J3", to: "bottom0J0", rate: 150}
    - {from: "right0J1", to: "left1J2", rate: 150}
    - {from: "right1J3", to: "left0J0", rate: 150}
    - {from: "bottom0J0", to: "top0J2", rate: 100}
    - {from: "bottom1J1", to: "top1J3", rate: 100}
    - {from: "left0J0", to: "right0J1", rate: 100}
    - {from: "left1J2", to: "right1J3", rate: 100}

emergency:
  enabled: true
  vehicles:
    - id: amb1
      depart: 300.0      # after the queues have built up
      from_edge: bottom0J0
      to_edge: top1J3
      approach_direction: S

incident:
  enabled: false
