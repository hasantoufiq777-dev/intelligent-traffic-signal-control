# nginx site for the platform: HTTPS, the static dashboard, the API and the live WebSocket.
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/itsc
#           sudo ln -s /etc/nginx/sites-available/itsc /etc/nginx/sites-enabled/itsc
#           sudo nginx -t && sudo systemctl reload nginx
# Replace traffic.example.org with your host name. Certificates: sudo certbot certonly --nginx -d traffic.example.org
# In /etc/nginx/nginx.conf set  worker_rlimit_nofile 65535;  and in events {}  worker_connections 4096;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream itsc_gateway {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name traffic.example.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }   # certbot renewals
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name traffic.example.org;

    ssl_certificate     /etc/letsencrypt/live/traffic.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traffic.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 64k;                # the API accepts at most 10 KB bodies
    access_log /var/log/nginx/itsc.access.log;
    error_log  /var/log/nginx/itsc.error.log warn;

    root /srv/itsc/client/dist;              # npm run build in client/

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed build files: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://itsc_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host keeps the port; the gateway compares the browser's Origin with this Host
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://itsc_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;             # longer than the 25 s Socket.io ping interval
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # The gateway sets the security headers (CSP, HSTS, nosniff) on the pages it serves; index.html is
    # served by nginx here, so repeat the essentials for it.
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
